# Re-runs the full analysis and the prompt-build hygiene test on a clean
# environment and fails if any released table, the statistics manifest, or
# the prompt-build hashes change — i.e., proves the release is reproducible.
name: reproduce-analysis
on: [push, pull_request]
permissions:
  contents: read
  issues: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Re-run primary analysis
        run: |
          cd reproduction/paper-brm/analysis
          python primary_analysis.py
      - name: Re-run prompt-build hygiene test
        run: |
          cd reproduction/synthetic
          python test_prompt_build_hygiene.py
      - name: Fail if any released output changed
        run: |
          git diff --exit-code -- \
            reproduction/paper-brm/analysis/tables \
            reproduction/paper-brm/analysis/numbers.md \
            reproduction/synthetic/prompt_build_hashes.csv
      - name: Verify file checksums
        run: |
          cd reproduction
          find . -name __pycache__ -type d -exec rm -rf {} +
          sha256sum --check --quiet CHECKSUMS.sha256
      - name: Report diff on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Reproduction diff on ${{ github.sha }}:"
            echo '```'
            git diff --stat
            echo '---'
            git diff | head -120
            echo '```'
          } > /tmp/diff-report.md
          gh issue create --title "CI reproduce diff ${{ github.sha }}" \
            --body-file /tmp/diff-report.md || true
